name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build bundle JAR（含前端）
        run: mvn -pl apps/server -am -B package -DskipTests -Pbundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-knowledge-server
          path: apps/server/target/fast-knowledge-server-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: fast-knowledge-server
          path: dist

      - name: Create release and attach JAR
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fast-knowledge-server-*.jar
            LICENSE
