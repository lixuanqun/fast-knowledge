# AI / RAG 相关配置：Embedding、分块、检索、Rerank、LLM、Wiki
knowledge:
  edition: ${KNOWLEDGE_EDITION:community}
  vector:
    local:
      storage-dir: ${VECTOR_LOCAL_DIR:./data/vectors}
  embedding:
    # openai（OpenAI 兼容 /v1/embeddings：DashScope compatible-mode、硅基流动、OpenAI 等）| ollama | hash
    provider: ${EMBEDDING_PROVIDER:openai}
    openai-base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    openai-api-key: ${EMBEDDING_API_KEY:}
    openai-model: ${EMBEDDING_MODEL:text-embedding-v3}
    # 维度必须与所选模型输出一致（text-embedding-v3=1024，text-embedding-3-small=1536）
    dimension: ${EMBEDDING_DIMENSION:1024}
    ollama-url: ${OLLAMA_EMBED_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  chunk:
    size: 512
    overlap: 50
  search:
    default-top-k: 8
    cache-ttl-minutes: 5
    rerank:
      enabled: ${RERANK_ENABLED:false}
      # 仅云端：cohere | jina（内网纯离线模式下必须关闭，见 ProductionConfigValidator）
      provider: ${RERANK_PROVIDER:cohere}
      candidate-multiplier: ${RERANK_CANDIDATE_MULTIPLIER:3}
      min-score: ${RERANK_MIN_SCORE:}
      cohere-api-key: ${COHERE_API_KEY:}
      cohere-model: ${RERANK_COHERE_MODEL:rerank-multilingual-v3.0}
      jina-api-key: ${JINA_API_KEY:}
      jina-model: ${RERANK_JINA_MODEL:jina-reranker-v2-base-multilingual}
  llm:
    provider: ${LLM_PROVIDER:ollama}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    max-tokens: 4096
    temperature: 0.3
    allow-external: ${LLM_ALLOW_EXTERNAL:true}
  chat:
    memory-window: ${CHAT_MEMORY_WINDOW:10}
  query-rewrite:
    enabled: ${QUERY_REWRITE_ENABLED:true}
    history-rounds: ${QUERY_REWRITE_HISTORY:5}
  agentic:
    enabled: ${AGENTIC_RETRIEVAL_ENABLED:true}
    max-sub-queries: ${AGENTIC_MAX_SUB_QUERIES:3}
    llm-decompose: ${AGENTIC_LLM_DECOMPOSE:true}
  index:
    pubsub-enabled: ${INDEX_PUBSUB_ENABLED:true}
    max-retry: ${INDEX_MAX_RETRY:3}
  wiki:
    enabled: ${WIKI_ENABLED:true}
    auto-publish: ${WIKI_AUTO_PUBLISH:false}
    query-routing: ${WIKI_QUERY_ROUTING:true}
    agent:
      # Wiki 维护 Agent（langgraph4j 图：增量合并 + Lint 循环 + 变更日志）；叠加企业版门控
      enabled: ${WIKI_AGENT_ENABLED:false}
      max-lint-iterations: ${WIKI_AGENT_MAX_LINT_ITERATIONS:2}
      llm-lint-enabled: ${WIKI_AGENT_LLM_LINT:true}
  writer:
    # 写文档多步编排（大纲→分节→引用→润色）
    graph-enabled: ${WRITER_GRAPH_ENABLED:false}
  vision:
    # 图片问答（qwen-vl 系列，云端；内网纯离线模式不可用）
    enabled: ${VISION_ENABLED:true}
    model: ${VISION_MODEL:qwen-vl-plus}
    max-image-mb: ${VISION_MAX_IMAGE_MB:10}
  image-gen:
    # 文生图（wanx 系列，DashScope 原生异步任务 API）
    enabled: ${IMAGE_GEN_ENABLED:true}
    model: ${IMAGE_GEN_MODEL:wanx2.1-t2i-turbo}
    size: ${IMAGE_GEN_SIZE:1024*1024}
    poll-timeout-seconds: ${IMAGE_GEN_POLL_TIMEOUT:120}
