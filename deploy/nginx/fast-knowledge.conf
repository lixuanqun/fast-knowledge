# Fast Knowledge — Nginx 反向代理（Linux 裸机部署，可选）
# 单 Jar（bundle profile）已在 8088 同时托管前端与 API，Nginx 仅用于：
#   80 端口统一入口、gzip 压缩、SSE 流式透传、后续挂 TLS 证书。
#
# 安装：cp deploy/nginx/fast-knowledge.conf /etc/nginx/conf.d/
#       nginx -t && systemctl reload nginx

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    # 安全响应头（可按需调整 CSP）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 应用全量代理（前端 + API）；后端 Spring Boot 监听 127.0.0.1:8088
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式（问答 / 对话 / 写作）：关闭缓冲，延长读超时
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        client_max_body_size 55m;
    }
}
