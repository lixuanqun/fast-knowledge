# Fast Knowledge 集群全栈部署（应用 + MySQL 5.7 + Redis + MinIO）
# 用法：cd docker && docker compose -f docker-compose.full.yml up -d

services:
  mysql:
    image: mysql:5.7
    container_name: fast-knowledge-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fast_knowledge
      MYSQL_USER: fast_knowledge
      MYSQL_PASSWORD: fast_knowledge
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fast-knowledge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fast-knowledge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/fast-knowledge || true;
      exit 0;
      "

  ollama:
    image: ollama/ollama:latest
    container_name: fast-knowledge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fast-knowledge-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: bundle
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      DB_URL: jdbc:mysql://mysql:3306/fast_knowledge?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USER: fast_knowledge
      DB_PASSWORD: fast_knowledge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_PROVIDER: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: fast-knowledge
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PREFIX: knowledge/
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?请设置 EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      VECTOR_LOCAL_DIR: /data/knowledge/vectors
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?请设置 LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
    volumes:
      - app_data:/data/knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  mysql_data:
  redis_data:
  minio_data:
  ollama_data:
  app_data:
